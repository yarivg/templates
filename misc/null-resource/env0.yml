version: 1

deploy:
  onSuccess:
    - echo 'my onSuccess'
    - curl --request GET --url https://api.env0.com/environments/deployments/$ENV0_DEPLOYMENT_LOG_ID -H "accept:application/json" --user "$ENV0_API_KEY:$ENV0_API_SECRET"
  steps:
    terraformInit:
      before:
        - echo 'my after terraformApply'
        - curl --request GET --url https://api.env0.com/environments/deployments/$ENV0_DEPLOYMENT_LOG_ID -H "accept:application/json" --user "$ENV0_API_KEY:$ENV0_API_SECRET"
    terraformApply:
      after:
        - echo 'my after terraformApply'
        - curl --request GET --url https://api.env0.com/environments/deployments/$ENV0_DEPLOYMENT_LOG_ID -H "accept:application/json" --user "$ENV0_API_KEY:$ENV0_API_SECRET"

  onFailure:
    - echo 'onFailure'

destroy:
  steps:
    terraformDestroy:
      before:
        - echo 'waittt'
